# Part 2 config A1: LSTM + soft attention over the 7x7 ResNet50 regions
# (beyond the syllabus). Same frozen ResNet50 as C1-C3, but the decoder sees
# all 49 image regions and attends to different ones for each word.
# Uses data/features/resnet50_grid.npy (python src/feature_extraction.py --mode grid).
# Run: python train.py --config experiments/config_attention.yaml --seed 1

config_name: attention
decoder: attention
encoder_mode: grid
max_length: 34
embedding_dim: 256
units: 256
dropout: 0.5
batch_size: 32
epochs: 40
learning_rate: 0.001
early_stopping_patience: 5
mask_padding_in_loss: true
