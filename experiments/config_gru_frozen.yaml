# Ablation config 3: GRU decoder + frozen ResNet50 encoder
# Run with: python train.py --decoder gru \
#             --features data/features/resnet50_frozen_features.pkl \
#             --config_name gru_frozen

config_name: gru_frozen
decoder: gru
encoder_mode: frozen
features_path: data/features/resnet50_frozen_features.pkl
max_length: 34
embedding_dim: 256
units: 256
batch_size: 64
epochs: 30
learning_rate: 0.001
