# Ablation config 1: LSTM decoder + frozen ResNet50 encoder (baseline)
# Run with: python train.py --decoder lstm \
#             --features data/features/resnet50_frozen_features.pkl \
#             --config_name lstm_frozen

config_name: lstm_frozen
decoder: lstm
encoder_mode: frozen
features_path: data/features/resnet50_frozen_features.pkl
max_length: 34
embedding_dim: 256
units: 256
batch_size: 64
epochs: 30
learning_rate: 0.001
