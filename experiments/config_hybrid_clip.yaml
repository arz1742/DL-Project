# Encoder comparison: CLIP ViT-B/32 (OpenAI 2021) image embeddings + hybrid decoder.
# CLIP was trained on 400M image-text pairs, so its features already link
# what is in a photo to words. Everything else matches hybrid_frozen (C3).
# Needs: python src/feature_extraction.py --mode clip
# Run: python train.py --config experiments/config_hybrid_clip.yaml --seed 1

config_name: hybrid_clip
decoder: hybrid
encoder_mode: frozen
features: clip
max_length: 34
embedding_dim: 256
units: 256
dropout: 0.5
batch_size: 32
epochs: 40
learning_rate: 0.001
early_stopping_patience: 5
mask_padding_in_loss: true
