# Core config C3: hybrid LSTM -> GRU decoder + frozen ResNet50 encoder
# Uses precomputed pooled features (data/features/resnet50_pooled.npy).
# Run: python train.py --config experiments/config_hybrid_frozen.yaml --seed 1

config_name: hybrid_frozen
decoder: hybrid
encoder_mode: frozen
max_length: 34
embedding_dim: 256
units: 256
dropout: 0.5
batch_size: 32
epochs: 40
learning_rate: 0.001
early_stopping_patience: 5
mask_padding_in_loss: true
