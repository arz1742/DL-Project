# Ablation config 4: GRU decoder + fine-tuned ResNet50 encoder
# Run with: python train.py --decoder gru \
#             --features data/features/resnet50_finetune_features.pkl \
#             --config_name gru_finetuned

config_name: gru_finetuned
decoder: gru
encoder_mode: finetune
features_path: data/features/resnet50_finetune_features.pkl
max_length: 34
embedding_dim: 256
units: 256
batch_size: 64
epochs: 30
learning_rate: 0.001
