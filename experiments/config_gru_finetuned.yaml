# Core config C5: GRU decoder + fine-tuned ResNet50 encoder
# Stage 2 of two-stage fine-tuning: starts from gru_frozen (same seed),
# then trains ResNet50's last block (conv5_x) together with the decoder.
# Uses precomputed stage-4 maps (data/features/resnet50_conv4.npy).
# Run AFTER gru_frozen: python train.py --config experiments/config_gru_finetuned.yaml --seed 1

config_name: gru_finetuned
decoder: gru
encoder_mode: finetune
init_from: gru_frozen
max_length: 34
embedding_dim: 256
units: 256
dropout: 0.5
batch_size: 32
epochs: 10
learning_rate: 0.00001        # low LR: ResNet50's conv5 block + decoder are updated together
early_stopping_patience: 3
mask_padding_in_loss: true
